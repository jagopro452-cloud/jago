name: jago-staging
region: blr

databases:
  - name: jago-staging-postgres
    engine: PG
    version: "18"
    production: false
    size: db-s-1vcpu-1gb
  - name: jago-staging-redis
    engine: REDIS
    version: "7"
    production: true
    cluster_name: jago-staging-redis
    size: db-s-1vcpu-1gb

services:
  - name: jago-staging-web
    source_dir: /
    github:
      repo: jagopro452-cloud/jago
      branch: release/preprod-hardening-2026-05-08-recovered
      deploy_on_push: false
    build_command: npm ci && npm run build
    run_command: npm run start
    http_port: 5000
    instance_count: 1
    instance_size_slug: basic-s
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "5000"
      - key: APP_ENV
        value: "staging"
      - key: APP_BASE_URL
        value: "https://staging.jagopro.org"
      - key: SOCKET_ALLOWED_ORIGINS
        value: "https://staging.jagopro.org"
      - key: ENABLE_DEV_OTP_RESPONSES
        value: "false"
      - key: ADMIN_NAME
        value: "Jago Staging Admin"
      - key: ADMIN_PASSWORD_SYNC_ON_RESTART
        value: "false"
      - key: ADMIN_SESSION_TTL_HOURS
        value: "8"
      - key: ADMIN_2FA_REQUIRED
        value: "true"
      - key: DATABASE_URL
        value: ${jago-staging-postgres.DATABASE_URL}
        type: SECRET
      - key: REDIS_URL
        value: ${jago-staging-redis.REDIS_URL}
        type: SECRET
      - key: ADMIN_EMAIL
        type: SECRET
      - key: ADMIN_PASSWORD
        type: SECRET
      - key: ADMIN_PHONE
        type: SECRET
      - key: ADMIN_RESET_KEY
        type: SECRET
      - key: OPS_API_KEY
        type: SECRET
      - key: ALERT_WEBHOOK_URL
        type: SECRET
      - key: GOOGLE_MAPS_API_KEY
        type: SECRET
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        type: SECRET
      - key: FIREBASE_WEB_API_KEY
        type: SECRET
      - key: RAZORPAY_KEY_ID
        type: SECRET
      - key: RAZORPAY_KEY_SECRET
        type: SECRET
      - key: RAZORPAY_WEBHOOK_SECRET
        type: SECRET
      - key: TWO_FACTOR_API_KEY
        type: SECRET
      - key: ANTHROPIC_API_KEY
        type: SECRET
