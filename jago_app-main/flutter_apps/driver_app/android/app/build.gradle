plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

import groovy.json.JsonSlurper

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasReleaseSigning = keystorePropertiesFile.exists() &&
        keystoreProperties['storeFile'] &&
        file(keystoreProperties['storeFile']).exists()

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def resolveGoogleMapsApiKey = {
    def envKey = System.getenv('GOOGLE_MAPS_KEY')
    if (envKey?.trim()) return envKey.trim()

    def localKey = localProperties.getProperty('GOOGLE_MAPS_KEY', '')
    if (localKey?.trim()) return localKey.trim()

    def googleServicesFile = file('google-services.json')
    if (googleServicesFile.exists()) {
        try {
            def parsed = new JsonSlurper().parseText(googleServicesFile.getText('UTF-8'))
            def clients = parsed?.client instanceof List ? parsed.client : []
            def packageName = "com.mindwhile.jago_pilot"
            def matchingClient = clients.find { client ->
                client?.client_info?.android_client_info?.package_name == packageName
            }
            def fallbackKey = matchingClient?.api_key?.find { it?.current_key }?.current_key
            if (fallbackKey?.trim()) return fallbackKey.trim()
        } catch (Exception ignored) {
        }
    }

    return ''
}

def googleMapsApiKey = resolveGoogleMapsApiKey()

android {
    namespace "com.mindwhile.jago_pilot"
    compileSdk 36
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias'] ?: 'jago'
            keyPassword keystoreProperties['keyPassword'] ?: ''
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword'] ?: ''
        }
    }

    defaultConfig {
        applicationId "com.mindwhile.jago_pilot"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 60
        versionName "1.0.60"
        multiDexEnabled true
        manifestPlaceholders = [googleMapsApiKey: googleMapsApiKey]
    }

    buildTypes {
        release {
            if (!hasReleaseSigning) {
                throw new GradleException("Missing Android release signing config. Add android/key.properties and the JAGO release keystore before building release APKs. Firebase OTP will not work on debug-signed release builds.")
            }
            signingConfig signingConfigs.release
            // Staging validation builds prioritize deterministic packaging over size optimization.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'
}
